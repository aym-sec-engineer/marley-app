services:
  traefik:
    image: traefik:v3.1@sha256:74d72c7a1345984f186bddbabcc462b2128d0d8054177dc84afaeac4db1f0f56
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=aym-sec-engineer@proton.me"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - web
      - monitoring
    restart: unless-stopped

  marley-waf:
    image: owasp/modsecurity-crs:nginx-alpine@sha256:ec7a6dfb73382c622b70fc488fadb12b9229fd31640ed26c371174f01d2a7c99
    container_name: marley-waf
    environment:
      - BACKEND=http://marley_app:5000
      - PROXY=1
      - PORT=8080
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waf.rule=Host(`marley.aymrajao.dev`) || Host(`137.74.163.44.sslip.io`)"
      - "traefik.http.routers.waf.entrypoints=websecure"
      - "traefik.http.routers.waf.tls.certresolver=letsencrypt"
      - "traefik.http.services.waf.loadbalancer.server.port=8080"
      - "traefik.docker.network=web"
    networks:
      - web
      - backend
    depends_on:
      - marley_app
    restart: unless-stopped

  marley_app:
    build: .
    image: cyberaym/marley-test:${MARLEY_IMAGE_TAG:?MARLEY_IMAGE_TAG must be set}
    container_name: marley_app
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    expose:
      - "5000"
    volumes:
      - ./compliance:/app/compliance:ro
    environment:
      - APP_NAME=MarleyDashboard
      - APP_VERSION=1.0.0
      - CROWDSEC_LAPI_URL=http://172.19.0.1:8080
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}

  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    expose:
      - "8080"

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring
      - web
    expose:
      - "9090"
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - web
    expose:
      - "3000"
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.aymrajao.dev`) || Host(`grafana.137.74.163.44.sslip.io`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=web"
    
  juice-shop:
    image: bkimminich/juice-shop:20.1.1@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    container_name: juice-shop
    restart: unless-stopped
    networks:
      - backend
    # AUCUN "ports:", AUCUN label traefik — c'est la garantie de non-exposition
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  web:
    external: true
  backend:
    internal: true
  monitoring:
    internal: true
volumes:
  prometheus_data:
  grafana_data:
