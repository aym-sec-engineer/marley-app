---
- name: Installation des paquets prérequis Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Création du dossier /etc/apt/keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Téléchargement de la clé GPG officielle Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Dépôt Docker Ubuntu (avec signed-by)
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Installer Docker Engine et Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Configuration de daemon.json (support min-api-version 1.24)
  copy:
    content: |
      {
        "min-api-version": "1.24"
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  register: docker_config

- name: Redémarrer Docker si daemon.json a changé
  service:
    name: docker
    state: restarted
  when: docker_config.changed

- name: S'assurer que le service Docker tourne
  service:
    name: docker
    state: started
    enabled: yes

- name: Ajouter l'utilisateur ubuntu au groupe docker
  user:
    name: ubuntu
    groups: docker
    append: yes
