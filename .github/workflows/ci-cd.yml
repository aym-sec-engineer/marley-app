name: Marley CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, non poussée)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cyberaym/marley-test:${{ steps.meta.outputs.tag }}

      - name: Trivy scan — bloquant sur CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cyberaym/marley-test:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy scan — rapport SARIF (visible dans l'onglet Security GitHub)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cyberaym/marley-test:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Docker login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push (uniquement si scan passé + branche main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cyberaym/marley-test:${{ steps.meta.outputs.tag }}
            cyberaym/marley-test:latest

  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/marley-app
            docker pull cyberaym/marley-test:${{ needs.build-scan-push.outputs.image_tag }}
            docker tag cyberaym/marley-test:${{ needs.build-scan-push.outputs.image_tag }} marley-app-marley_app:latest
            docker compose up -d --no-deps marley_app
            docker image prune -f